# Caddy (HTTPS) devant Supabase auto-hébergé.
#
# Supabase tourne via son propre docker-compose officiel (voir README).
# Ce compose-ci ajoute UNIQUEMENT Caddy, attaché au réseau Docker de Supabase
# pour pouvoir joindre le service « kong » en interne.
#
# Avant de lancer : créer .env (cf .env.example) avec GM_DOMAIN, GM_EMAIL et
# SUPABASE_NETWORK (le nom du réseau créé par le compose Supabase).

services:
  caddy:
    image: caddy:2
    container_name: gm-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      - GM_DOMAIN=${GM_DOMAIN}
      - GM_EMAIL=${GM_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    networks:
      - supabase

networks:
  supabase:
    external: true
    # Nom du réseau créé par le compose Supabase (souvent « supabase_default »
    # ou « docker_default » selon le nom du dossier). À vérifier avec :
    #   docker network ls
    name: ${SUPABASE_NETWORK:-supabase_default}
